<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat de Suporte - BrainrotBR</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #000000;
            --gh-color: radial-gradient(circle, #16004a, #021d24);
            --text-color: #fff;
            --accent: #4a004a;
            --accent-color: #c300ff;
            --accent-2: #b200ff;
            --accent-3: #6b00ff;
            --primary-color: #00c3ff;
            --card-color: #0000006c;
            --border-color: rgba(255, 255, 255, 0.1);
            --success-color: #2ecc71;
            --danger-color: #e74c3c;
            --warning-color: #f39c12;
        }

        body {
            background: var(--gh-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(90deg, var(--accent-color), var(--accent-3));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .chat-container {
            flex: 1;
            display: flex;
            gap: 20px;
            height: calc(100vh - 200px);
        }

        .order-info {
            flex: 0 0 300px;
            background: var(--card-color);
            border-radius: 15px;
            padding: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-color);
        }

        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--card-color);
            border-radius: 15px;
            overflow: hidden;
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-color);
        }

        .messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 15px;
            position: relative;
        }

        .message.client {
            align-self: flex-end;
            background: linear-gradient(90deg, var(--accent-2), var(--accent-3));
            color: white;
        }

        .message.admin {
            align-self: flex-start;
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }

        .message.system {
            align-self: center;
            background: rgba(255, 165, 0, 0.2);
            border: 1px solid rgba(255, 165, 0, 0.3);
            color: #ffa500;
            max-width: 90%;
            text-align: center;
        }

        .message-time {
            font-size: 0.8rem;
            opacity: 0.7;
            margin-top: 5px;
        }

        .input-area {
            padding: 20px;
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }

        .message-input {
            flex: 1;
            padding: 12px 15px;
            border-radius: 25px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(0, 0, 0, 0.3);
            color: var(--text-color);
            font-size: 16px;
            resize: none;
            min-height: 50px;
            max-height: 120px;
        }

        .message-input:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        .send-btn {
            background: linear-gradient(90deg, var(--accent-2), var(--accent-3));
            color: white;
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: transform 0.3s;
        }

        .send-btn:hover {
            transform: scale(1.05);
        }

        .file-btn {
            background: transparent;
            color: var(--text-color);
            border: 1px solid rgba(255, 255, 255, 0.2);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: all 0.3s;
        }

        .file-btn:hover {
            border-color: var(--accent-color);
            color: var(--accent-color);
        }

        .file-input {
            display: none;
        }

        .order-items {
            max-height: 200px;
            overflow-y: auto;
            margin-bottom: 15px;
        }

        .order-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid var(--border-color);
        }

        .back-btn {
            background: transparent;
            color: var(--text-color);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 10px 20px;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 15px;
            width: 100%;
            transition: all 0.3s;
        }

        .back-btn:hover {
            border-color: var(--accent-color);
            color: var(--accent-color);
        }

        .media-message {
            max-width: 300px;
            margin: 5px 0;
        }

        .media-message img, .media-message video {
            max-width: 100%;
            border-radius: 10px;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
            margin-left: 10px;
        }

        .status-pending {
            background: rgba(243, 156, 18, 0.2);
            color: #f39c12;
        }

        .status-paid {
            background: rgba(46, 204, 113, 0.2);
            color: #2ecc71;
        }

        .rating-section {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            margin: 20px 0;
            text-align: center;
        }
        
        .stars {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 15px 0;
        }
        
        .star {
            font-size: 24px;
            color: #555;
            cursor: pointer;
            transition: color 0.3s;
        }
        
        .star:hover,
        .star.active {
            color: #ffd700;
        }
        
        .rating-comment {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: rgba(0, 0, 0, 0.3);
            color: var(--text-color);
            margin-bottom: 10px;
            resize: vertical;
        }

        .btn-ghost {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-ghost:hover {
            border-color: var(--accent-color);
            color: var(--accent-color);
        }

        /* Notificações suaves */
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: var(--card-color);
            border: 1px solid var(--accent-color);
            color: var(--text-color);
            padding: 15px 20px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            z-index: 10000;
            transform: translateX(400px);
            transition: transform 0.3s ease;
            max-width: 300px;
            backdrop-filter: blur(10px);
        }

        .notification.show {
            transform: translateX(0);
        }

        .notification.success {
            border-color: var(--success-color);
            background: rgba(46, 204, 113, 0.1);
        }

        .notification.error {
            border-color: var(--danger-color);
            background: rgba(231, 76, 60, 0.1);
        }

        .notification.warning {
            border-color: var(--warning-color);
            background: rgba(243, 156, 18, 0.1);
        }

        .notification-content {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .notification-icon {
            font-size: 20px;
        }

        .notification-message {
            flex: 1;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Suporte BrainrotBR</h1>
            <p>Chat de atendimento ao cliente</p>
        </div>

        <div class="chat-container">
            <div class="order-info">
                <h3>📦 Seu Pedido</h3>
                <div id="orderDetails">
                    <!-- Detalhes do pedido serão preenchidos aqui -->
                </div>
                <div class="order-items" id="orderItems">
                    <!-- Itens do pedido serão preenchidos aqui -->
                </div>
                <div class="order-total">
                    <strong>Total: <span id="orderTotal">R$ 0,00</span></strong>
                </div>
                <div class="payment-status">
                    <strong>Status: <span id="paymentStatus" class="status-badge status-pending">Pendente</span></strong>
                </div>
                
                <div class="rating-section" id="ratingSection" style="display: none;">
                    <h4>⭐ Avalie o Atendimento</h4>
                    <div class="stars" id="stars">
                        <span class="star" data-rating="1">★</span>
                        <span class="star" data-rating="2">★</span>
                        <span class="star" data-rating="3">★</span>
                        <span class="star" data-rating="4">★</span>
                        <span class="star" data-rating="5">★</span>
                    </div>
                    <textarea class="rating-comment" id="ratingComment" placeholder="Comentário opcional..."></textarea>
                    <button class="btn-ghost" onclick="submitRating()">Enviar Avaliação</button>
                </div>
                
                <button class="back-btn" onclick="window.location.href='index.html'">
                    Voltar para a Loja
                </button>
            </div>

            <div class="chat-area">
                <div class="messages" id="messages">
                    <div class="message system">
                        Bem-vindo ao suporte BrainrotBR! Aguarde enquanto um de nossos atendentes responde sua mensagem.
                    </div>
                </div>

                <div class="input-area">
                    <input type="file" id="fileInput" class="file-input" accept="image/*,video/*">
                    <button class="file-btn" onclick="document.getElementById('fileInput').click()">
                        <i class="fas fa-paperclip"></i>
                    </button>
                    <textarea class="message-input" id="messageInput" placeholder="Digite sua mensagem... (use /avaliar para avaliar o atendimento)" rows="1"></textarea>
                    <button class="send-btn" id="sendBtn">
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentChatId = null;
        let messages = [];
        let ws = null;
        let currentRating = 0;
        let messagePollingInterval = null;

        // Sistema de notificações suaves
        function showNotification(message, type = 'info', duration = 4000) {
            const notification = document.createElement('div');
            notification.className = `notification ${type}`;
            notification.innerHTML = `
                <div class="notification-content">
                    <div class="notification-icon">
                        ${type === 'success' ? '✅' : type === 'error' ? '❌' : type === 'warning' ? '⚠️' : 'ℹ️'}
                    </div>
                    <div class="notification-message">${message}</div>
                </div>
            `;
            
            document.body.appendChild(notification);
            
            // Mostrar notificação
            setTimeout(() => {
                notification.classList.add('show');
            }, 100);
            
            // Esconder após o tempo
            setTimeout(() => {
                notification.classList.remove('show');
                setTimeout(() => {
                    if (notification.parentNode) {
                        notification.parentNode.removeChild(notification);
                    }
                }, 300);
            }, duration);
        }

        document.addEventListener('DOMContentLoaded', function() {
            const urlParams = new URLSearchParams(window.location.search);
            currentChatId = urlParams.get('chatId');

            if (!currentChatId) {
                currentChatId = localStorage.getItem('currentChatId');
                if (!currentChatId) {
                    showNotification('Chat não encontrado. Redirecionando para a loja...', 'error', 3000);
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 3000);
                    return;
                }
            }

            loadOrderInfo();
            loadMessages();
            setupEventListeners();
            connectWebSocket();
            setupRatingStars();
            startMessagePolling();
        });

        function connectWebSocket() {
            try {
                const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
                const wsUrl = `${protocol}//${window.location.host}?chatId=${currentChatId}&userType=client`;
                
                ws = new WebSocket(wsUrl);
                
                ws.onopen = () => {
                    console.log('✅ Conectado ao WebSocket como cliente');
                    showNotification('Conectado ao suporte', 'success', 2000);
                };
                
                ws.onmessage = (event) => {
                    try {
                        const data = JSON.parse(event.data);
                        console.log('📨 Mensagem WebSocket recebida:', data.type);
                        
                        if (data.type === 'new_message') {
                            handleNewMessage(data.message);
                        }
                        
                        if (data.type === 'payment_updated') {
                            updatePaymentStatus(data.status);
                            if (data.status === 'paid') {
                                showRatingSection();
                                showNotification('Pagamento confirmado! Você já pode avaliar o atendimento.', 'success');
                            }
                        }
                        
                    } catch (error) {
                        console.error('❌ Erro ao processar mensagem WebSocket:', error);
                    }
                };
                
                ws.onclose = () => {
                    console.log('🔌 Conexão WebSocket fechada');
                    showNotification('Conexão perdida. Reconectando...', 'warning', 3000);
                    setTimeout(connectWebSocket, 5000);
                };
                
                ws.onerror = (error) => {
                    console.error('❌ Erro WebSocket:', error);
                    showNotification('Erro na conexão', 'error', 3000);
                };
                
            } catch (error) {
                console.error('❌ Erro ao conectar WebSocket:', error);
                showNotification('Erro ao conectar com o suporte', 'error');
            }
        }

        function handleNewMessage(message) {
            // Salvar mensagem no localStorage
            messages.push(message);
            saveMessages();
            
            // Adicionar à UI
            addMessage(message);
            
            // Mostrar notificação para novas mensagens do admin
            if (message.sender === 'admin') {
                showNotification('Nova mensagem do atendente', 'info');
            }
        }

        // Polling para garantir atualização mesmo sem WebSocket
        function startMessagePolling() {
            messagePollingInterval = setInterval(() => {
                checkForNewMessages();
            }, 2000); // Verificar a cada 2 segundos
        }

        function checkForNewMessages() {
            const savedMessages = JSON.parse(localStorage.getItem(`chat_${currentChatId}`) || '[]');
            const currentMessageCount = document.querySelectorAll('#messages .message').length;
            
            if (savedMessages.length > currentMessageCount) {
                messages = savedMessages;
                renderMessages();
            }
        }

        function setupRatingStars() {
            const stars = document.getElementById('stars').querySelectorAll('.star');
            stars.forEach(star => {
                star.addEventListener('click', function() {
                    const rating = parseInt(this.getAttribute('data-rating'));
                    currentRating = rating;
                    
                    stars.forEach(s => {
                        const sRating = parseInt(s.getAttribute('data-rating'));
                        if (sRating <= rating) {
                            s.classList.add('active');
                        } else {
                            s.classList.remove('active');
                        }
                    });
                });
            });
        }

        function showRatingSection() {
            document.getElementById('ratingSection').style.display = 'block';
        }

        function submitRating() {
            if (currentRating === 0) {
                showNotification('Por favor, selecione uma avaliação de 1 a 5 estrelas.', 'warning');
                return;
            }

            const comment = document.getElementById('ratingComment').value.trim();
            
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({
                    type: 'rating',
                    data: {
                        rating: currentRating,
                        comment: comment,
                        chatId: currentChatId
                    }
                }));
                showNotification('Avaliação enviada com sucesso!', 'success');
            } else {
                showNotification('Sem conexão com o servidor', 'warning');
            }

            document.getElementById('ratingSection').style.display = 'none';
            currentRating = 0;
            document.getElementById('ratingComment').value = '';
            const stars = document.getElementById('stars').querySelectorAll('.star');
            stars.forEach(star => star.classList.remove('active'));
        }

        function loadOrderInfo() {
            // Primeiro tenta buscar pelo pedido individual
            let orderData = JSON.parse(localStorage.getItem('currentOrder') || '{}');
            
            // Se não encontrar, busca no sistema de múltiplos pedidos
            if (!orderData.chatId && currentChatId) {
                const allOrders = JSON.parse(localStorage.getItem('allOrders') || '[]');
                orderData = allOrders.find(order => order.chatId === currentChatId) || {};
            }
            
            if (orderData.customer) {
                document.getElementById('orderDetails').innerHTML = `
                    <div><strong>Cliente:</strong> ${orderData.customer.name}</div>
                    <div><strong>Email:</strong> ${orderData.customer.email}</div>
                    <div><strong>Nick Roblox:</strong> ${orderData.customer.nick}</div>
                `;
            }

            if (orderData.items) {
                const itemsContainer = document.getElementById('orderItems');
                itemsContainer.innerHTML = '';
                
                orderData.items.forEach(item => {
                    const itemElement = document.createElement('div');
                    itemElement.className = 'order-item';
                    itemElement.innerHTML = `
                        <span>${item.nome} x${item.quantidade}</span>
                        <span>R$ ${(item.preco * item.quantidade).toFixed(2)}</span>
                    `;
                    itemsContainer.appendChild(itemElement);
                });
            }

            if (orderData.total) {
                document.getElementById('orderTotal').textContent = `R$ ${orderData.total.toFixed(2)}`;
            }

            updatePaymentStatus(orderData.paymentStatus);
            
            if (orderData.paymentStatus === 'paid') {
                showRatingSection();
            }
        }

        function updatePaymentStatus(status) {
            const statusElement = document.getElementById('paymentStatus');
            if (status === 'paid') {
                statusElement.textContent = 'Pago';
                statusElement.className = 'status-badge status-paid';
            } else {
                statusElement.textContent = 'Pendente';
                statusElement.className = 'status-badge status-pending';
            }
        }

        function loadMessages() {
            const savedMessages = localStorage.getItem(`chat_${currentChatId}`);
            if (savedMessages) {
                messages = JSON.parse(savedMessages);
                renderMessages();
            }
        }

        function setupEventListeners() {
            const messageInput = document.getElementById('messageInput');
            const sendBtn = document.getElementById('sendBtn');
            const fileInput = document.getElementById('fileInput');

            messageInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            });

            sendBtn.addEventListener('click', sendMessage);

            fileInput.addEventListener('change', function(e) {
                if (e.target.files.length > 0) {
                    sendMediaMessage(e.target.files[0]);
                }
            });

            messageInput.addEventListener('input', function() {
                this.style.height = 'auto';
                this.style.height = Math.min(this.scrollHeight, 120) + 'px';
            });
        }

        function sendMessage() {
            const messageInput = document.getElementById('messageInput');
            const text = messageInput.value.trim();

            if (!text) return;

            if (text.startsWith('/avaliar')) {
                showRatingSection();
                messageInput.value = '';
                return;
            }

            const message = {
                id: Date.now(),
                text: text,
                sender: 'client',
                timestamp: new Date().toISOString(),
                type: 'text'
            };

            addMessage(message);
            messageInput.value = '';
            messageInput.style.height = 'auto';

            // Atualizar o sistema de múltiplos pedidos
            if (currentChatId) {
                const allOrders = JSON.parse(localStorage.getItem('allOrders') || '[]');
                const orderIndex = allOrders.findIndex(order => order.chatId === currentChatId);
                if (orderIndex !== -1) {
                    allOrders[orderIndex].lastMessage = text;
                    allOrders[orderIndex].lastMessageTime = new Date().toISOString();
                    allOrders[orderIndex].unread = (allOrders[orderIndex].unread || 0) + 1;
                    localStorage.setItem('allOrders', JSON.stringify(allOrders));
                }
            }

            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({
                    type: 'chat_message',
                    data: message
                }));
            } else {
                showNotification('Sem conexão com o servidor', 'warning');
            }
        }

        function sendMediaMessage(file) {
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const message = {
                    id: Date.now(),
                    mediaUrl: e.target.result,
                    sender: 'client',
                    timestamp: new Date().toISOString(),
                    type: file.type.startsWith('image/') ? 'image' : 'video',
                    fileName: file.name
                };

                addMessage(message);

                // Atualizar o sistema de múltiplos pedidos
                if (currentChatId) {
                    const allOrders = JSON.parse(localStorage.getItem('allOrders') || '[]');
                    const orderIndex = allOrders.findIndex(order => order.chatId === currentChatId);
                    if (orderIndex !== -1) {
                        allOrders[orderIndex].lastMessage = `Arquivo: ${file.name}`;
                        allOrders[orderIndex].lastMessageTime = new Date().toISOString();
                        allOrders[orderIndex].unread = (allOrders[orderIndex].unread || 0) + 1;
                        localStorage.setItem('allOrders', JSON.stringify(allOrders));
                    }
                }

                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({
                        type: 'chat_message',
                        data: message
                    }));
                } else {
                    showNotification('Sem conexão com o servidor', 'warning');
                }
                
                showNotification('Arquivo enviado com sucesso', 'success');
            };
            reader.readAsDataURL(file);
            document.getElementById('fileInput').value = '';
        }

        function addMessage(message) {
            messages.push(message);
            saveMessages();
            renderMessages();
        }

        function saveMessages() {
            localStorage.setItem(`chat_${currentChatId}`, JSON.stringify(messages));
        }

        function renderMessages() {
            const container = document.getElementById('messages');
            container.innerHTML = '';

            messages.forEach(message => {
                const messageElement = document.createElement('div');
                messageElement.className = `message ${message.sender}`;

                if (message.type === 'text' || message.type === 'system') {
                    messageElement.innerHTML = `
                        <div>${message.text}</div>
                        <div class="message-time">${formatTime(message.timestamp)}</div>
                    `;
                } else if (message.type === 'image' || message.type === 'video') {
                    messageElement.innerHTML = `
                        <div class="media-message">
                            ${message.type === 'image' ? 
                                `<img src="${message.mediaUrl}" alt="${message.fileName}">` :
                                `<video controls><source src="${message.mediaUrl}" type="video/mp4"></video>`
                            }
                        </div>
                        <div class="message-time">${formatTime(message.timestamp)}</div>
                    `;
                }

                container.appendChild(messageElement);
            });

            container.scrollTop = container.scrollHeight;
        }

        function formatTime(timestamp) {
            const date = new Date(timestamp);
            return date.toLocaleTimeString('pt-BR', { 
                hour: '2-digit', 
                minute: '2-digit' 
            });
        }

        // Limpar intervalo quando a página for fechada
        window.addEventListener('beforeunload', () => {
            if (messagePollingInterval) {
                clearInterval(messagePollingInterval);
            }
        });
    </script>
</body>
</html>
