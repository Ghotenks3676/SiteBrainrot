<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - BrainrotBR</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
    :root {
        --bg-color: #060014;
        --gh-color: radial-gradient(circle at top left, #120038, #010a16 80%);
        --text-color: #f4f4f4;
        --accent-color: #c300ff;
        --accent-2: #9c00ff;
        --accent-3: #5300ff;
        --card-color: rgba(255, 255, 255, 0.05);
        --border-color: rgba(255, 255, 255, 0.12);
        --success-color: #2ecc71;
        --error-color: #e74c3c;
        --font-main: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        --transition: 0.3s ease;
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        background: var(--gh-color);
        color: var(--text-color);
        font-family: var(--font-main);
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 20px;
        overflow-x: hidden;
    }

    .container {
        width: 100%;
        max-width: 850px;
        animation: fadeIn 0.8s ease;
    }

    .checkout-card {
        background: var(--card-color);
        border: 1px solid var(--border-color);
        border-radius: 20px;
        padding: 40px;
        box-shadow: 0 0 40px rgba(195, 0, 255, 0.15);
        backdrop-filter: blur(12px);
        transition: transform var(--transition), box-shadow var(--transition);
    }

    .checkout-card:hover {
        transform: translateY(-3px);
        box-shadow: 0 0 60px rgba(195, 0, 255, 0.25);
    }

    .checkout-header {
        text-align: center;
        margin-bottom: 40px;
    }

    .checkout-header h1 {
        font-size: 2.8rem;
        background: linear-gradient(90deg, var(--accent-color), var(--accent-3));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        font-weight: 700;
        letter-spacing: 1px;
    }

    .checkout-header p {
        color: #aaa;
        font-size: 1rem;
        margin-top: 5px;
    }

    .checkout-items {
        border-radius: 10px;
        overflow: hidden;
        margin-bottom: 25px;
    }

    .checkout-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 15px 10px;
        border-bottom: 1px solid var(--border-color);
        transition: background var(--transition);
    }

    .checkout-item:hover {
        background: rgba(255, 255, 255, 0.05);
    }

    .checkout-item strong {
        font-size: 1rem;
    }

    .checkout-item div {
        font-size: 0.9rem;
        color: #ccc;
    }

    .checkout-total {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 1.4rem;
        font-weight: bold;
        border-top: 2px solid var(--border-color);
        margin-top: 20px;
        padding-top: 20px;
    }

    .form-group {
        margin-bottom: 25px;
        width: 70%;
    }

    .form-group label {
        display: block;
        font-weight: bold;
        margin-bottom: 8px;
        color: #ddd;
        font-size: 0.95rem;
    }

    .form-group input {
        width: 100%;
        padding: 14px 16px;
        border-radius: 10px;
        border: 1px solid var(--border-color);
        background: rgba(255, 255, 255, 0.05);
        color: var(--text-color);
        font-size: 16px;
        transition: var(--transition);
    }

    .form-group input:focus {
        border-color: var(--accent-color);
        box-shadow: 0 0 10px rgba(195, 0, 255, 0.3);
        outline: none;
    }

    .payment-section {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid var(--border-color);
        border-radius: 12px;
        padding: 30px 20px;
        text-align: center;
        margin: 35px 0;
        position: relative;
    }

    .payment-section h3 {
        margin-bottom: 20px;
        background: linear-gradient(90deg, var(--accent-color), var(--accent-3));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
    }

    .qr-code {
        width: 220px;
        height: 220px;
        margin: 0 auto 20px;
        border-radius: 10px;
        overflow: hidden;
        border: 2px solid var(--accent-3);
        box-shadow: 0 0 20px rgba(195, 0, 255, 0.2);
    }

    .qr-code img {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    .pix-code {
        background: rgba(0, 0, 0, 0.4);
        padding: 12px;
        border-radius: 10px;
        font-family: monospace;
        color: #fff;
        word-break: break-all;
        border: 1px solid var(--border-color);
        margin-bottom: 15px;
        transition: 0.2s ease;
        width: fit-content;
        margin-left: auto;
        margin-right: auto;
    }

    .pix-code:hover {
        border-color: var(--accent-color);
        box-shadow: 0 0 10px rgba(195, 0, 255, 0.3);
    }

    .btn-ghost {
        background: transparent;
        border: 1px solid var(--border-color);
        color: var(--text-color);
        padding: 10px 16px;
        border-radius: 8px;
        cursor: pointer;
        transition: var(--transition);
        font-weight: 500;
        font-size: 0.95rem;
    }

    .btn-ghost:hover {
        border-color: var(--accent-color);
        color: var(--accent-color);
        box-shadow: 0 0 15px rgba(195, 0, 255, 0.25);
    }

    .terms {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        background: rgba(255, 255, 255, 0.05);
        border-radius: 10px;
        padding: 15px 20px;
        border: 1px solid var(--border-color);
        margin-top: 25px;
        width: fit-content;
        cursor: pointer;
        transition: var(--transition);
        margin-left: auto;
        margin-right: auto;
    }

    .terms span {
        color: #ccc;
        font-size: 0.9rem;
        cursor: pointer;
    }

    .btn-primary {
        background: linear-gradient(90deg, var(--accent-2), var(--accent-3));
        color: white;
        border: none;
        padding: 15px;
        border-radius: 12px;
        font-size: 18px;
        font-weight: bold;
        cursor: pointer;
        transition: var(--transition);
        width: fit-content;
        margin-top: 25px;
        letter-spacing: 0.5px;
        margin-left: auto;
        margin-right: auto;
    }

    .btn-primary:hover:not(:disabled) {
        transform: translateY(-3px);
        box-shadow: 0 0 25px rgba(195, 0, 255, 0.3);
    }

    .btn-primary:disabled {
        opacity: 0.5;
        cursor: not-allowed;
    }

    .back-btn {
        display: block;
        width: fit-content;
        text-align: center;
        background: transparent;
        border: 1px solid var(--border-color);
        color: #bbb;
        border-radius: 12px;
        padding: 12px;
        margin-top: 15px;
        cursor: pointer;
        transition: var(--transition);
        align-items: center;
        margin-left: auto;
    }

    .back-btn:hover {
        color: var(--accent-color);
        border-color: var(--accent-color);
    }

    .alert {
        padding: 14px 16px;
        border-radius: 10px;
        margin-bottom: 20px;
        display: none;
        font-weight: 500;
        animation: fadeIn 0.5s ease;
    }

    .alert-success {
        background: rgba(46, 204, 113, 0.15);
        border: 1px solid rgba(46, 204, 113, 0.3);
        color: #2ecc71;
    }

    .alert-error {
        background: rgba(231, 76, 60, 0.15);
        border: 1px solid rgba(231, 76, 60, 0.3);
        color: #e74c3c;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(15px); }
        to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 600px) {
        .checkout-card {
            padding: 25px;
        }

        .checkout-header h1 {
            font-size: 2rem;
        }

        .qr-code {
            width: 180px;
            height: 180px;
        }
    }
</style>

</head>
<body>
    <div class="container">
        <div class="checkout-card">
            <div class="checkout-header">
                <h1>Checkout</h1>
                <p>Complete suas informações para finalizar a compra</p>
            </div>

            <div id="alertContainer"></div>

            <div class="checkout-items" id="checkoutItems">
                <!-- Itens preenchidos por JavaScript -->
            </div>

            <div class="checkout-total">
                <span>Total:</span>
                <span id="checkoutTotal">R$ 0,00</span>
            </div>

            <form id="checkoutForm">
                <div class="form-group">
                    <label for="name">Nome Completo *</label>
                    <input type="text" id="name" required>
                </div>

                <div class="form-group">
                    <label for="email">E-mail *</label>
                    <input type="email" id="email" required>
                </div>

                <div class="form-group">
                    <label for="nick">Nick do Roblox *</label>
                    <input type="text" id="nick" required placeholder="Seu nick no Roblox">
                </div>

                <div class="payment-section">
                    <h3>Pagamento via PIX</h3>
                    <div class="qr-code">
                        <img src="https://cdn.discordapp.com/attachments/1417922244553998431/1424064894059417781/Screenshot_20251004-1204262.png?ex=68f117c8&is=68efc648&hm=d8e575be7c0ccab2565796a13bc265f20f556d174e35c8f5d07dd6365105b27f&" alt="QR Code PIX">
                    </div>
                    <p>Escaneie o QR Code acima ou use o código abaixo</p>
                    <div class="pix-code" id="pixCode">
                        maycondouglas1893@gmail.com
                    </div>
                    <button type="button" class="btn-ghost" onclick="copyPixCode()" style="background: transparent; border: 1px solid rgba(255,255,255,0.2); color: white; padding: 8px 15px; border-radius: 5px; cursor: pointer;">
                        <i class="fas fa-copy"></i> Copiar Código PIX
                    </button>
                </div>

                <div class="terms">
                    <label>
                        <input type="checkbox" id="terms" required>
                        <span>Eu li e concordo com os termos e condições de serviço</span>
                    </label>
                </div>

                <button type="button" class="btn-primary" id="nextBtn" disabled>
                    Seguinte
                </button>
            </form>

            <button class="back-btn" onclick="window.location.href='index.html'">
                Voltar para a Loja
            </button>
        </div>
    </div>

    <script>
        // Recuperar dados do carrinho
        const cart = JSON.parse(sessionStorage.getItem('checkoutCart')) || [];
        const total = parseFloat(sessionStorage.getItem('checkoutTotal')) || 0;

        document.addEventListener('DOMContentLoaded', function() {
            renderCheckoutItems();
            setupFormValidation();
        });

        function renderCheckoutItems() {
            const container = document.getElementById('checkoutItems');
            const totalElement = document.getElementById('checkoutTotal');

            if (cart.length === 0) {
                container.innerHTML = '<p style="text-align:center;padding:20px;">Seu carrinho está vazio.</p>';
                totalElement.textContent = 'R$ 0,00';
                return;
            }

            container.innerHTML = '';
            let calculatedTotal = 0;

            cart.forEach(item => {
                const itemTotal = item.preco * item.quantidade;
                calculatedTotal += itemTotal;

                const itemElement = document.createElement('div');
                itemElement.className = 'checkout-item';
                itemElement.innerHTML = `
                    <div>
                        <strong>${item.nome}</strong>
                        <div style="font-size:14px;color:#aaa;">Quantidade: ${item.quantidade}</div>
                    </div>
                    <div>R$ ${itemTotal.toFixed(2)}</div>
                `;
                container.appendChild(itemElement);
            });

            totalElement.textContent = `R$ ${calculatedTotal.toFixed(2)}`;
        }

        function setupFormValidation() {
            const nameInput = document.getElementById('name');
            const emailInput = document.getElementById('email');
            const nickInput = document.getElementById('nick');
            const termsCheckbox = document.getElementById('terms');
            const nextBtn = document.getElementById('nextBtn');

            function validateForm() {
                const isFormValid = nameInput.value.trim() !== '' &&
                                  emailInput.value.trim() !== '' &&
                                  nickInput.value.trim() !== '' &&
                                  termsCheckbox.checked;

                nextBtn.disabled = !isFormValid;
            }

            nameInput.addEventListener('input', validateForm);
            emailInput.addEventListener('input', validateForm);
            nickInput.addEventListener('input', validateForm);
            termsCheckbox.addEventListener('change', validateForm);

            nextBtn.addEventListener('click', proceedToChat);
        }

        function copyPixCode() {
            const pixCode = document.getElementById('pixCode').textContent;
            navigator.clipboard.writeText(pixCode).then(() => {
                showAlert('Código PIX copiado!', 'success');
            }).catch(() => {
                showAlert('Erro ao copiar código.', 'error');
            });
        }

        function proceedToChat() {
            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const nick = document.getElementById('nick').value.trim();

            // Criar chat ID único
            const chatId = 'chat_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);

            // Salvar dados do pedido
            const orderData = {
                chatId: chatId,
                customer: { name, email, nick },
                items: cart,
                total: total,
                timestamp: new Date().toISOString()
            };

            // Salvar no localStorage para o chat
            localStorage.setItem('currentOrder', JSON.stringify(orderData));
            localStorage.setItem('currentChatId', chatId);

            // Redirecionar para o chat do cliente
            window.location.href = `client-chat.html?chatId=${chatId}`;
        }

        function showAlert(message, type) {
            const container = document.getElementById('alertContainer');
            const alert = document.createElement('div');
            alert.className = `alert alert-${type}`;
            alert.textContent = message;
            alert.style.display = 'block';

            container.appendChild(alert);

            setTimeout(() => {
                alert.remove();
            }, 5000);
        }

        // Verificar se há dados no carrinho
        if (cart.length === 0) {
            showAlert('Seu carrinho está vazio. Redirecionando para a loja...', 'error');
            setTimeout(() => {
                window.location.href = 'index.html';
            }, 3000);
        }
    </script>
</body>
</html>
